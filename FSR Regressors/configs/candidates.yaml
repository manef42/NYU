version: 2
random_state: 42

# New database contains only physics-based features.
# No feature_set distinction.

# Bootstrap rows added to training partitions under the rd_bt augmentation.
bootstrap_rows: 1000

candidates:


  # =====================================================
  # XGBOOST
  # =====================================================

  - candidate_id: xgb_baseline
    model_family: xgboost
    paper_weight: none
    fixed_params:
      objective_variant: squarederror

  - candidate_id: xgb_paper_sqrt
    model_family: xgboost
    paper_weight: sqrt
    fixed_params:
      objective_variant: squarederror

  - candidate_id: xgb_paper_inverse
    model_family: xgboost
    paper_weight: inverse
    fixed_params:
      objective_variant: squarederror

  - candidate_id: xgb_absoluteerror_sqrt
    model_family: xgboost
    paper_weight: sqrt
    fixed_params:
      objective_variant: absoluteerror

  - candidate_id: xgb_absoluteerror_inverse
    model_family: xgboost
    paper_weight: inverse
    fixed_params:
      objective_variant: absoluteerror

  - candidate_id: xgb_pseudohuber_sqrt
    model_family: xgboost
    paper_weight: sqrt
    fixed_params:
      objective_variant: pseudohuber

  - candidate_id: xgb_pseudohuber_inverse
    model_family: xgboost
    paper_weight: inverse
    fixed_params:
      objective_variant: pseudohuber

  - candidate_id: xgb_log_target_sqrt
    model_family: xgboost
    paper_weight: sqrt
    target_transform: signed_log1p
    fixed_params:
      objective_variant: squarederror

  - candidate_id: xgb_log_target_inverse
    model_family: xgboost
    paper_weight: inverse
    target_transform: signed_log1p
    fixed_params:
      objective_variant: squarederror

  - candidate_id: xgb_monotone_o2_sqrt
    model_family: xgboost
    paper_weight: sqrt
    monotone_oxygen: true
    fixed_params:
      objective_variant: squarederror

  - candidate_id: xgb_monotone_o2_inverse
    model_family: xgboost
    paper_weight: inverse
    monotone_oxygen: true
    fixed_params:
      objective_variant: squarederror

  - candidate_id: xgb_paper_bagging_sqrt
    model_family: xgboost
    paper_weight: sqrt
    paper_bagging: 10
    fixed_params:
      objective_variant: squarederror


  # =====================================================
  # DECISION TREE
  # =====================================================

  - candidate_id: dt_baseline
    model_family: decision_tree
    paper_weight: none

  - candidate_id: dt_paper_sqrt
    model_family: decision_tree
    paper_weight: sqrt

  - candidate_id: dt_paper_inverse
    model_family: decision_tree
    paper_weight: inverse


  # =====================================================
  # KNN
  # =====================================================

  - candidate_id: knn_baseline
    model_family: knn
    paper_weight: none

  - candidate_id: knn_paper_sqrt
    model_family: knn
    paper_weight: sqrt

  - candidate_id: knn_paper_inverse
    model_family: knn
    paper_weight: inverse

  - candidate_id: knn_distance_sqrt
    model_family: knn
    paper_weight: sqrt
    fixed_params:
      weights: distance

  - candidate_id: knn_distance_inverse
    model_family: knn
    paper_weight: inverse
    fixed_params:
      weights: distance

  - candidate_id: knn_manhattan_sqrt
    model_family: knn
    paper_weight: sqrt
    fixed_params:
      p: 1

  - candidate_id: knn_manhattan_inverse
    model_family: knn
    paper_weight: inverse
    fixed_params:
      p: 1


  # =====================================================
  # MLP
  # =====================================================

  - candidate_id: mlp_baseline
    model_family: mlp
    paper_weight: none

  - candidate_id: mlp_paper_sqrt
    model_family: mlp
    paper_weight: sqrt

  - candidate_id: mlp_paper_inverse
    model_family: mlp
    paper_weight: inverse

  - candidate_id: mlp_tanh_sqrt
    model_family: mlp
    paper_weight: sqrt
    fixed_params:
      activation: tanh

  - candidate_id: mlp_tanh_inverse
    model_family: mlp
    paper_weight: inverse
    fixed_params:
      activation: tanh

  - candidate_id: mlp_log_target_sqrt
    model_family: mlp
    paper_weight: sqrt
    target_transform: signed_log1p

  - candidate_id: mlp_log_target_inverse
    model_family: mlp
    paper_weight: inverse
    target_transform: signed_log1p
