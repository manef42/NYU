version: 2
random_state: 42

# New database contains only physics-based features.
# No feature_set distinction.

candidates:

  # =====================================================
  # XGBOOST
  # =====================================================

  - candidate_id: xgb_baseline
    model_family: xgboost
    paper_weight: none
    class_weight: false
    fixed_params:
      objective_variant: logistic

  - candidate_id: xgb_weighted
    model_family: xgboost
    paper_weight: sqrt
    class_weight: true
    fixed_params:
      objective_variant: logistic

  - candidate_id: xgb_focal
    model_family: xgboost
    paper_weight: sqrt
    class_weight: true
    fixed_params:
      objective_variant: focal
      focal_gamma: 2.0


  # =====================================================
  # RANDOM FOREST / DECISION TREE
  # =====================================================

  - candidate_id: decision_tree_baseline
    model_family: decision_tree
    paper_weight: none
    class_weight: false

  - candidate_id: decision_tree_weighted
    model_family: decision_tree
    paper_weight: sqrt
    class_weight: true

  - candidate_id: decision_tree_pruned_weighted
    model_family: decision_tree
    paper_weight: sqrt
    class_weight: true
    fixed_params:
      max_depth: tuned
      min_samples_leaf: tuned


  # =====================================================
  # KNN
  # =====================================================

  - candidate_id: knn_baseline
    model_family: knn
    paper_weight: none
    class_weight: false

  - candidate_id: knn_weighted
    model_family: knn
    paper_weight: sqrt
    class_weight: true

  - candidate_id: knn_distance_weighted
    model_family: knn
    paper_weight: sqrt
    class_weight: true
    fixed_params:
      weights: distance


  # =====================================================
  # MLP
  # =====================================================

  - candidate_id: mlp_baseline
    model_family: mlp
    paper_weight: none
    class_weight: false

  - candidate_id: mlp_weighted
    model_family: mlp
    paper_weight: sqrt
    class_weight: true

  - candidate_id: mlp_focal
    model_family: mlp
    paper_weight: sqrt
    class_weight: true
    fixed_params:
      loss_variant: focal
      focal_gamma: 2.0


  # =====================================================
  # SVM
  # =====================================================

  - candidate_id: svm_baseline
    model_family: svm
    paper_weight: none
    class_weight: false

  - candidate_id: svm_weighted
    model_family: svm
    paper_weight: sqrt
    class_weight: true

  - candidate_id: svm_rbf_weighted
    model_family: svm
    paper_weight: sqrt
    class_weight: true
    fixed_params:
      kernel: rbf
