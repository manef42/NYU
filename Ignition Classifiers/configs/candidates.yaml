version: 5
random_state: 42

# New database contains only physics-based features.
# No feature_set distinction.

candidates:

  # =====================================================
  # XGBOOST
  # =====================================================

  - candidate_id: xgb_baseline
    model_family: xgboost
    paper_weight: none
    class_weight: false
    fixed_params:
      objective_variant: logistic

  - candidate_id: xgb_paper_sqrt
    model_family: xgboost
    paper_weight: sqrt
    class_weight: false
    fixed_params:
      objective_variant: logistic

  - candidate_id: xgb_paper_inverse
    model_family: xgboost
    paper_weight: inverse
    class_weight: false
    fixed_params:
      objective_variant: logistic

  - candidate_id: xgb_class_only
    model_family: xgboost
    paper_weight: none
    class_weight: true
    fixed_params:
      objective_variant: logistic

  - candidate_id: xgb_weighted_sqrt
    model_family: xgboost
    paper_weight: sqrt
    class_weight: true
    fixed_params:
      objective_variant: logistic

  - candidate_id: xgb_weighted_inverse
    model_family: xgboost
    paper_weight: inverse
    class_weight: true
    fixed_params:
      objective_variant: logistic

  - candidate_id: xgb_focal_sqrt
    model_family: xgboost
    paper_weight: sqrt
    class_weight: false
    fixed_params:
      objective_variant: focal
      focal_gamma: 2.0

  - candidate_id: xgb_focal_inverse
    model_family: xgboost
    paper_weight: inverse
    class_weight: false
    fixed_params:
      objective_variant: focal
      focal_gamma: 2.0


  # =====================================================
  # DECISION TREE
  # =====================================================

  - candidate_id: dt_baseline
    model_family: decision_tree
    paper_weight: none
    class_weight: false

  - candidate_id: dt_weighted_sqrt
    model_family: decision_tree
    paper_weight: sqrt
    class_weight: true

  - candidate_id: dt_weighted_inverse
    model_family: decision_tree
    paper_weight: inverse
    class_weight: true


  # =====================================================
  # KNN
  # =====================================================

  - candidate_id: knn_baseline
    model_family: knn
    paper_weight: none
    class_weight: false

  - candidate_id: knn_weighted_sqrt
    model_family: knn
    paper_weight: sqrt
    class_weight: true

  - candidate_id: knn_weighted_inverse
    model_family: knn
    paper_weight: inverse
    class_weight: true

  - candidate_id: knn_distance_sqrt
    model_family: knn
    paper_weight: sqrt
    class_weight: true
    fixed_params:
      weights: distance

  - candidate_id: knn_distance_inverse
    model_family: knn
    paper_weight: inverse
    class_weight: true
    fixed_params:
      weights: distance


  # =====================================================
  # MLP
  # =====================================================

  - candidate_id: mlp_baseline
    model_family: mlp
    paper_weight: none
    class_weight: false

  - candidate_id: mlp_weighted_sqrt
    model_family: mlp
    paper_weight: sqrt
    class_weight: true

  - candidate_id: mlp_weighted_inverse
    model_family: mlp
    paper_weight: inverse
    class_weight: true

  - candidate_id: mlp_focal_sqrt
    model_family: mlp
    paper_weight: sqrt
    class_weight: false
    fixed_params:
      loss_variant: focal
      focal_gamma: 2.0

  - candidate_id: mlp_focal_inverse
    model_family: mlp
    paper_weight: inverse
    class_weight: false
    fixed_params:
      loss_variant: focal
      focal_gamma: 2.0


  # =====================================================
  # SVM
  # =====================================================

  - candidate_id: svm_baseline
    model_family: svm
    paper_weight: none
    class_weight: false

  - candidate_id: svm_weighted_sqrt
    model_family: svm
    paper_weight: sqrt
    class_weight: true

  - candidate_id: svm_weighted_inverse
    model_family: svm
    paper_weight: inverse
    class_weight: true

  - candidate_id: svm_linear_sqrt
    model_family: svm
    paper_weight: sqrt
    class_weight: true
    fixed_params:
      kernel: linear

  - candidate_id: svm_linear_inverse
    model_family: svm
    paper_weight: inverse
    class_weight: true
    fixed_params:
      kernel: linear
